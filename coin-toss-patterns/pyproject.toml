[project]
name = "coin-toss-patterns"
version = "0.2.0"
description = "Waiting times for coin-toss patterns: simulation and exact counts"
authors = [{ name = "DrSkippy", email = "scott@drskippy.net" }]
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coin_toss_patterns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
