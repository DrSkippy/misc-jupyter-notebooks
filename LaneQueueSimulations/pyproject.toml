[tool.poetry]
name = "lane-queues"
version = "0.1.0"
description = "Simulation of shoppers choosing checkout lines (power of d choices)"
authors = ["DrSkippy <scott@drskippy.net>"]
packages = [{include = "lane_queues"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26"
pandas = "^2.2"
matplotlib = "^3.8"
jupyter = "^1.0"
ipykernel = "^6.29"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
