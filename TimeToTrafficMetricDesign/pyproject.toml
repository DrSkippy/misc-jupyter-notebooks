[tool.poetry]
name = "time-to-traffic-sim"
version = "0.1.0"
description = "Monte Carlo simulation and metric analysis for time-to-first-traffic"
authors = ["Scott <scott@drskippy.net>"]
packages = [{include = "time_to_traffic_sim"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26"
scipy = "^1.12"
matplotlib = "^3.8"
seaborn = "^0.13"
pandas = "^2.2"
jupyter = "^1.0"
ipykernel = "^6.29"
click = "^8.1"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
black = "^24.0"
mypy = "^1.9"
types-pyyaml = "^6.0"
pandas-stubs = "^2.2"

[tool.black]
line-length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
